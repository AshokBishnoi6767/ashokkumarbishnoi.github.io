<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | Ashok Kumar Bishnoi
    {% else %}
      Ashok Kumar Bishnoi
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
</head>

<body>

  <header class="site-header">
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        Ashok Kumar Bishnoi
      </a>

      <div class="nav-links">
        <a href="{{ '/' | relative_url }}">About</a>
        <a href="{{ '/portfolio.html' | relative_url }}">Portfolio</a>
        <a href="{{ '/blog/' | relative_url }}">Writing</a>
      </div>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>© {{ 'now' | date: "%Y" }} Ashok Kumar Bishnoi</p>
  </footer>

</body>
</html>
